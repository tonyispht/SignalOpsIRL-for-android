name: Build APK

on:
  push:
    branches: [main]
  # Publish a version from the Releases page (Draft a new release -> new tag vX.Y.Z -> Publish). Tag pushes alone
  # are not built, so a release never gets two builds with different version codes.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_ALIAS: signalopsirl
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Work out the version
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          if [[ "${{ github.event_name }}" == "release" || "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "LABEL=$TAG" >> "$GITHUB_ENV"
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "LABEL=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "VERSION_NAME=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          # Always increases, so every new APK installs over the previous one.
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Restore the release signing key
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          # signing/release.jks.enc is the release keystore, encrypted with SIGNING_STORE_PASSWORD
          # (AES-256, PBKDF2 600k rounds). The password secret is the only thing needed to unlock it.
          PW="$(printf '%s' "$STORE_PASSWORD" | tr -d '[:space:]')"
          if [[ -z "$PW" ]]; then
            echo "::warning::SIGNING_STORE_PASSWORD is not set, so this build uses a temporary debug key."
            echo "SIGNED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::add-mask::$PW"
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/release.jks.enc \
               -out "$RUNNER_TEMP/release.jks" -pass "pass:$PW" 2>/dev/null \
             || ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -storepass "$PW" \
               -alias "$SIGNING_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::SIGNING_STORE_PASSWORD is wrong (password length ${#PW}, expected 32)."
            exit 1
          fi
          echo "Release key unlocked."
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          if [[ "$SIGNED" == "1" ]]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "SignalOpsIRL-${LABEL}.apk"
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "SignalOpsIRL-${LABEL}.apk"
          fi
          echo "APK=SignalOpsIRL-${LABEL}.apk" >> "$GITHUB_ENV"
          # update.json lets the app's in-app updater check the version and the download's integrity.
          SHA=$(sha256sum "SignalOpsIRL-${LABEL}.apk" | cut -d' ' -f1)
          printf '{"versionCode": %s, "versionName": "%s", "apk": "%s", "sha256": "%s", "signed": %s}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "SignalOpsIRL-${LABEL}.apk" "$SHA" "$([[ "$SIGNED" == "1" ]] && echo true || echo false)" > update.json
          cat update.json

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalOpsIRL-apk
          path: |
            ${{ env.APK }}
            update.json

      - name: Publish GitHub Release
        if: github.event_name == 'release' && env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ env.APK }}
            update.json
          generate_release_notes: true
          append_body: true
          body: |
            ## Install
            1. Download **${{ env.APK }}** below on your Android phone (Android 8.0 or newer).
            2. Open it and allow installing from this source when Android asks.
            3. Launch Signal OPS IRL and accept the Terms of Responsible Use.

            Already have 1.2.0 or newer? Update from inside the app: **Settings > App updates**.

            Please use Signal OPS IRL responsibly. Enjoying it? [Buy me a coffee](https://buymeacoffee.com/Tonyispht) ☕

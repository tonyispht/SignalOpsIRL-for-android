name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="build-${GITHUB_RUN_NUMBER}"
          [[ "${{ github.event_name }}" == "release" ]] && VERSION="${{ github.event.release.tag_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "SignalOpsIRL-${VERSION}.apk"
          echo "APK=SignalOpsIRL-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalOpsIRL-apk
          path: ${{ env.APK }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: ${{ env.APK }}
          generate_release_notes: true
          body: |
            ## Install
            1. Download **${{ env.APK }}** below on your Android phone (Android 8.0 or newer).
            2. Open it and allow installing from this source when Android asks.
            3. Launch Signal OPS IRL and accept the Terms of Responsible Use.

            Please use Signal OPS IRL responsibly. Enjoying it? [Buy me a coffee](https://buymeacoffee.com/Tonyispht) ☕

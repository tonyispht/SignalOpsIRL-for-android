name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_ALIAS: signalopsirl
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Work out the version
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          if [[ "${{ github.event_name }}" == "release" || "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "LABEL=$TAG" >> "$GITHUB_ENV"
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "LABEL=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "VERSION_NAME=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          # Always increases, so every new APK installs over the previous one.
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not set, so this build uses a temporary debug key."
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          if [[ "$SIGNED" == "1" ]]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "SignalOpsIRL-${LABEL}.apk"
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "SignalOpsIRL-${LABEL}.apk"
          fi
          echo "APK=SignalOpsIRL-${LABEL}.apk" >> "$GITHUB_ENV"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalOpsIRL-apk
          path: ${{ env.APK }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: ${{ env.APK }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Install
            1. Download **${{ env.APK }}** below on your Android phone (Android 8.0 or newer).
            2. Open it and allow installing from this source when Android asks.
            3. Launch Signal OPS IRL and accept the Terms of Responsible Use.

            Please use Signal OPS IRL responsibly. Enjoying it? [Buy me a coffee](https://buymeacoffee.com/Tonyispht) ☕

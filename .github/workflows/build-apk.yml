name: Build APK

on:
  push:
    branches: [main]
  # Publish a version from the Releases page (Draft a new release -> new tag vX.Y.Z -> Publish). Tag pushes alone
  # are not built, so a release never gets two builds with different version codes.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_ALIAS: signalopsirl
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Work out the version
        run: |
          # The version lives in app/build.gradle.kts (appVersionCode / appVersionName), where F-Droid reads it too.
          CODE=$(sed -nE 's/^val appVersionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          NAME=$(sed -nE 's/^val appVersionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            if [[ "$TAG" != "v$NAME" ]]; then
              echo "::error::Release tag $TAG does not match appVersionName $NAME in app/build.gradle.kts. Bump the version first."
              exit 1
            fi
            echo "LABEL=$TAG" >> "$GITHUB_ENV"
          else
            echo "LABEL=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Restore the release signing key
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          # signing/release.jks.enc is the release keystore, encrypted with SIGNING_STORE_PASSWORD
          # (AES-256, PBKDF2 600k rounds). The password secret is the only thing needed to unlock it.
          PW="$(printf '%s' "$STORE_PASSWORD" | tr -d '[:space:]')"
          if [[ -z "$PW" ]]; then
            echo "::warning::SIGNING_STORE_PASSWORD is not set, so this build uses a temporary debug key."
            echo "SIGNED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::add-mask::$PW"
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/release.jks.enc \
               -out "$RUNNER_TEMP/release.jks" -pass "pass:$PW" 2>/dev/null \
             || ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -storepass "$PW" \
               -alias "$SIGNING_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::SIGNING_STORE_PASSWORD is wrong (password length ${#PW}, expected 32)."
            exit 1
          fi
          echo "Release key unlocked."
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Build APKs
        run: |
          # Two APKs from the same code: the app under its ID, and the "bridge" under the original ID
          # (com.example.signalopsirl) that moves 1.x players across (see Migration.kt).
          if [[ "$SIGNED" == "1" ]]; then TASK=assembleGithubRelease; OUT=app/build/outputs/apk/github/release/app-github-release.apk
          else TASK=assembleGithubDebug; OUT=app/build/outputs/apk/github/debug/app-github-debug.apk; fi
          APK="SignalOpsIRL-${LABEL}.apk"
          BRIDGE="SignalOpsIRL-${LABEL}-old-app-bridge.apk"
          gradle --no-daemon "$TASK"
          cp "$OUT" "$APK"
          gradle --no-daemon "$TASK" -Plegacy
          cp "$OUT" "$BRIDGE"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "BRIDGE=$BRIDGE" >> "$GITHUB_ENV"
          # update-<app id>.json: what the in-app updater of each app ID installs. update.json is read by 1.1 / 1.2,
          # which only exist under the original ID, so it points at the bridge.
          meta() {
            printf '{"versionCode": %s, "versionName": "%s", "apk": "%s", "sha256": "%s", "signed": %s}\n' \
              "$VERSION_CODE" "$VERSION_NAME" "$1" "$(sha256sum "$1" | cut -d' ' -f1)" "$([[ "$SIGNED" == "1" ]] && echo true || echo false)"
          }
          meta "$APK" > update-io.github.tonyispht.signalopsirl.json
          meta "$BRIDGE" > update-com.example.signalopsirl.json
          cp update-com.example.signalopsirl.json update.json
          cat update-*.json

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalOpsIRL-apk
          path: |
            ${{ env.APK }}
            ${{ env.BRIDGE }}
            update*.json

      - name: Publish GitHub Release
        if: github.event_name == 'release' && env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ env.APK }}
            ${{ env.BRIDGE }}
            update.json
            update-io.github.tonyispht.signalopsirl.json
            update-com.example.signalopsirl.json
          generate_release_notes: true
          append_body: true
          body: |
            ## Install
            1. Download **${{ env.APK }}** below on your Android phone (Android 8.0 or newer).
               (The `old-app-bridge` APK is only for the in-app update of older versions; you don't need it.)
            2. Open it and allow installing from this source when Android asks.
            3. Launch Signal OPS IRL and accept the Terms of Responsible Use.

            Already have Signal OPS IRL? Update from inside the app: **Settings > App updates**. Coming from 1.2 or older,
            the app then offers to move you to the new app with your progress.

            Please use Signal OPS IRL responsibly. Enjoying it? [Buy me a coffee](https://buymeacoffee.com/Tonyispht) ☕
